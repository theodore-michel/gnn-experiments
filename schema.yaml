# ──────────────────────────────────────────────────────────────────────
# Run-record YAML schema (template / reference).
# One file per run, stored in registry/<run_id>.yaml
# All fields are documented with inline comments.
# ──────────────────────────────────────────────────────────────────────

# --- Identity -----------------------------------------------------------
run_id: "re100_full_20250305_001"       # Human-readable, auto-generated
parent_run_id: null                     # Non-null when relaunched from another run
created_at: "2025-03-05T14:30:00"       # ISO-8601 timestamp of registration
slurm_job_id: null                      # Filled after sbatch submission

# --- Source traceability ------------------------------------------------
base_commit: null                       # graph-physics commit hash (user-supplied or from BASE_COMMIT file)
source_diff: |                          # Unified diff of run folder vs clean graph-physics base
  --- a/graphphysics/external/onecyl.py
  +++ b/graphphysics/external/onecyl.py
  @@ ...
run_dir: "/absolute/path/to/run/folder" # Absolute path to the original run folder

# --- Dataset ------------------------------------------------------------
dataset:
  name: "onecyl"                        # Dataset family
  re_case: "Re2"                        # Reynolds number case: Re2/Re3/Re4
  variant: "full"                       # full (120 cases) or mini (50 cases)
  path: "/scratch-big/.../train"        # Absolute path from parameters JSON
  meta_path: "dataset_config/onecyl_meta.json"  # Relative meta path

# --- Model & architecture -----------------------------------------------
model:
  type: "transformer"                   # Model type (transformer, epd, ...)
  message_passing_num: 15               # Number of message-passing layers
  hidden_size: 128                      # Hidden dimension
  node_input_size: 6                    # Input feature dimension
  output_size: 3                        # Output dimension
  edge_input_size: 0                    # Edge feature dimension (0 = no edge features)
  num_heads: 4                          # Attention heads (transformer only)

# --- Features -----------------------------------------------------------
features:
  input_fields:                         # Inferred from onecyl.py / parameters
    - "velocity_xy"
    - "pressure"
    - "levelset"
    - "pos_xy"
    - "nodetype"
  no_edge_feature: true                 # --no_edge_feature flag

# --- Loss configuration -------------------------------------------------
loss:
  type:                                 # List of loss term names
    - "l2loss"
    - "gradientl2loss"
    - "convectionl2loss"
    - "divergencel2loss"
    - "gradientpressurel2loss"
  weights:                              # Corresponding weights
    - 1.0
    - 0.01
    - 0.0001
    - 0.1
    - 0.01
  gradient_method: "finite_diff"        # Gradient computation method

# --- Noise --------------------------------------------------------------
noise:
  amplitudes: [0.02, 0.01]             # Per-group noise amplitudes
  index_start: [0, 2]                  # Start indices for noise groups
  index_end: [2, 3]                    # End indices for noise groups

# --- Training hyperparameters -------------------------------------------
training:
  num_epochs: 20
  init_lr: 0.0001
  batch_size: 2
  warmup: 1500
  seed: 42
  num_workers: 2
  prefetch_factor: 2
  project_name: "onecyl_article"        # WandB project name

# --- Full parameter files (embedded) ------------------------------------
parameters_json: {}                     # Full copy of the training parameters JSON
job_sh: |                               # Full copy of job.sh
  #!/bin/bash
  ...

# --- SLURM / HPC -------------------------------------------------------
slurm:
  partition: "GPU"                      # SLURM partition
  gres: "gpu:2g.10gb:1"                # GPU resource request
  gpu_type: "NVIDIA A100-PCIE-40GB"    # Actual GPU type (from wandb or sacct)
  wall_clock_seconds: null              # Training wall-clock time in seconds
  node: "node-99"                       # SLURM node

# --- Checkpoint ---------------------------------------------------------
checkpoint:
  path: "/absolute/path/checkpoints/model.ckpt"  # Absolute path to .ckpt
  save_name: "T_onecyl_Re2_VPLN_lgud"            # --model_save_name value

# --- Weights & Biases ---------------------------------------------------
wandb:
  run_id: "1koz7qkt"                    # WandB run ID
  url: null                             # WandB run URL (filled by update)
  project: "onecyl_article"             # WandB project name

# --- Metrics (filled by 'update' command) --------------------------------
metrics:
  final:
    val_rollout_rmse: null              # val/rollout_rmse at last epoch
    val_1step_rmse: null                # val/1step_rmse at last epoch
    train_loss: null                    # train/loss at last epoch
  best:
    val_rollout_rmse: null              # Best val/rollout_rmse across all epochs
    val_1step_rmse: null                # Best val/1step_rmse across all epochs
    train_loss: null                    # Best train/loss across all epochs

# --- Notes ---------------------------------------------------------------
notes: ""                               # Free-text annotations
