# Conda environment for GNN postprocessing only.
# Create with:  conda env create -f environment.yml
# Update with:  conda env update -f environment.yml --prune
name: gnnpostprocess
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - numpy
  - scipy
  - pandas
  - matplotlib
  - tqdm
  - meshio
  - h5py
